<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entreprises</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toasts" aria-live="polite"></div>

  <!-- Proposition de recrutement -->
  <div id="offer" class="modal-wrap hidden"><div class="modal small" role="alertdialog" aria-modal="true"></div></div>

  <!-- Modération (staff) -->
  <div id="admin" class="modal-wrap hidden"><div class="modal admin" role="dialog" aria-modal="true" aria-label="Entreprises des joueurs"></div></div>

  <!-- Tablette -->
  <div id="tablet" class="hidden">
    <div class="tab-frame">
      <nav class="tab-nav" id="tabNav" aria-label="Sections de la tablette"></nav>
      <main class="tab-main">
        <header class="tab-head">
          <div><div class="eyebrow" id="tabEyebrow">Entreprise</div><h1 id="tabTitle">Tableau de bord</h1></div>
          <div class="tab-head-right"><span class="pill" id="tabDuty">Hors service</span><span class="clock" id="tabClock">--:--</span>
            <button class="icon-btn" id="tabClose" aria-label="Fermer la tablette" title="Fermer (Échap)">✕</button></div>
        </header>
        <section class="tab-body" id="tabBody" tabindex="-1"></section>
      </main>
    </div>
  </div>

  <!-- Confirmation -->
  <div id="confirm" class="modal-wrap hidden top"><div class="modal small" role="alertdialog" aria-modal="true"></div></div>

  <script src="app.js"></script>
  <script src="tablet.js"></script>
  <script src="admin.js"></script>
</body>
</html>
